{% extends "faculty/base.html" %}

{% block content %}
    {% if faculty %}
        <h1>{{ faculty.name }}</h1>

        <article>
            {{ faculty.description|linebreaks }}
        </article>

        <article>
            <h2>Контакти</h2>
            {{ faculty.contacts|linebreaks }}
        </article>
    {% else %}
        <h1>Факультет природничих наук</h1>
        <p>Інформацію про факультет буде додано незабаром.</p>
    {% endif %}
{% endblock %}
